version: '3.8'

services:
  # The Python FastAPI backend handles phishing detection logic
  backend:
    image: rohit124551/phishguard-backend:latest
    container_name: phishguard-backend
    ports:
      - "8000:8000"
    env_file: ./phishing-detector/backend/.env
    restart: unless-stopped
    networks:
      - phishguard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # The Next.js frontend UI for users
  frontend:
    image: rohit124551/phishguard-frontend:latest
    container_name: phishguard-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - phishguard-network
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000

networks:
  phishguard-network:
    driver: bridge
