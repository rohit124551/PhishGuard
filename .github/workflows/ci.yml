name: PhishGuard CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      working-directory: ./phishing-detector/backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Docker Image
      working-directory: ./phishing-detector/backend
      run: |
        docker build -t phishguard-api:latest .

    - name: Run Smoke Tests inside Docker
      working-directory: ./phishing-detector/backend
      run: |
        # Start the container
        docker run -d -p 8000:8000 --name test-api phishguard-api:latest
        
        # Wait for the server to start
        sleep 5
        
        # Run tests against the container
        python smoke_test.py
        
        # Clean up
        docker stop test-api
